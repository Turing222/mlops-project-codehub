#通用的日志模板
x-logging: &default-logging
  driver: "awslogs"
  options:
    awslogs-group: ${DEPLOY_CW_LOG_GROUP:-/dewflow/prod}
    awslogs-region: ${DEPLOY_AWS_REGION:-us-east-1}
    awslogs-stream-prefix: ${DEPLOY_CW_LOG_STREAM_PREFIX:-dewflow}

x-security: &default-security
  security_opt:
    - no-new-privileges:true

x-deploy-env-file: &deploy-env-file
  - ${DEPLOY_SERVICE_ENV_FILE:-./.env.ec2}

x-app-secrets: &app-secrets
  - SECRET_KEY
  - POSTGRES_PASSWORD
  - REDIS_PASSWORD
  - OPENAI_API_KEY
  - DASHSCOPE_API_KEY
  - DASHSCOPE_API_KEY_2
  - GEMINI_API_KEY
  - GOOGLE_API_KEY
  - GOOGLE_CLIENT_SECRET
  - GITHUB_TOKEN
  - GROWTHBOOK_SDK_KEY
  - DEEPSEEK_API_KEY
  - DEEPSEEK_API_KEY_2
  - COHERE_API_KEY
  - COHERE_API_KEY_2
  - BIFROST_API_KEY
  - BIFROST_ENCRYPTION_KEY
  - LLM_API_KEY
  - RAG_EMBED_API_KEY
  - LANGFUSE_PUBLIC_KEY
  - LANGFUSE_SECRET_KEY
  - S3_ACCESS_KEY_ID
  - S3_SECRET_ACCESS_KEY
  - TAVILY_API_KEY

x-secret-file-env: &secret-file-env
  SECRET_KEY_FILE: /run/secrets/SECRET_KEY
  POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
  REDIS_PASSWORD_FILE: /run/secrets/REDIS_PASSWORD
  OPENAI_API_KEY_FILE: /run/secrets/OPENAI_API_KEY
  DASHSCOPE_API_KEY_FILE: /run/secrets/DASHSCOPE_API_KEY
  DASHSCOPE_API_KEY_2_FILE: /run/secrets/DASHSCOPE_API_KEY_2
  GEMINI_API_KEY_FILE: /run/secrets/GEMINI_API_KEY
  GOOGLE_API_KEY_FILE: /run/secrets/GOOGLE_API_KEY
  GOOGLE_CLIENT_SECRET_FILE: /run/secrets/GOOGLE_CLIENT_SECRET
  GITHUB_TOKEN_FILE: /run/secrets/GITHUB_TOKEN
  GROWTHBOOK_SDK_KEY_FILE: /run/secrets/GROWTHBOOK_SDK_KEY
  DEEPSEEK_API_KEY_FILE: /run/secrets/DEEPSEEK_API_KEY
  DEEPSEEK_API_KEY_2_FILE: /run/secrets/DEEPSEEK_API_KEY_2
  COHERE_API_KEY_FILE: /run/secrets/COHERE_API_KEY
  COHERE_API_KEY_2_FILE: /run/secrets/COHERE_API_KEY_2
  BIFROST_API_KEY_FILE: /run/secrets/BIFROST_API_KEY
  BIFROST_ENCRYPTION_KEY_FILE: /run/secrets/BIFROST_ENCRYPTION_KEY
  LLM_API_KEY_FILE: /run/secrets/LLM_API_KEY
  RAG_EMBED_API_KEY_FILE: /run/secrets/RAG_EMBED_API_KEY
  LANGFUSE_PUBLIC_KEY_FILE: /run/secrets/LANGFUSE_PUBLIC_KEY
  LANGFUSE_SECRET_KEY_FILE: /run/secrets/LANGFUSE_SECRET_KEY
  S3_ACCESS_KEY_ID_FILE: /run/secrets/S3_ACCESS_KEY_ID
  S3_SECRET_ACCESS_KEY_FILE: /run/secrets/S3_SECRET_ACCESS_KEY
  TAVILY_API_KEY_FILE: /run/secrets/TAVILY_API_KEY

x-db-migration-secrets: &db-migration-secrets
  - SECRET_KEY
  - POSTGRES_PASSWORD

x-db-migration-secret-file-env: &db-migration-secret-file-env
  SECRET_KEY_FILE: /run/secrets/SECRET_KEY
  POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD

# AWS-like runtime defaults for backend containers.
# Keep S3_ENDPOINT_URL and static credentials empty so boto3 uses real AWS S3
# and the default credential chain, preferably an EC2 instance profile.
x-backend-aws-env: &backend-aws-env
  APP_ENV: ${APP_ENV:-prod}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_PREFIX: ${S3_PREFIX:-knowledge_files}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-verify-full}
  POSTGRES_SSL_ROOT_CERT_FILE: ${POSTGRES_SSL_ROOT_CERT_FILE:-}
  ENABLE_OTEL_METRICS: ${ENABLE_OTEL_METRICS:-false}
  ENABLE_OTEL_TRACES: ${ENABLE_OTEL_TRACES:-false}
  OTEL_METRICS_ENDPOINT: ${OTEL_METRICS_ENDPOINT:-}
  OTEL_TRACES_ENDPOINT: ${OTEL_TRACES_ENDPOINT:-}
  OTEL_SEMCONV_STABILITY_OPT_IN: ${OTEL_SEMCONV_STABILITY_OPT_IN:-http}

services:

  redis:
    <<: *default-security
    image: redis:7.4.9-alpine
    container_name: redis
    restart: unless-stopped
    env_file: *deploy-env-file
    secrets:
      - REDIS_PASSWORD
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging
    command: >
      sh -c 'umask 077 && printf "maxmemory 384mb\nmaxmemory-policy allkeys-lru\nrequirepass %s\n" "$$(cat /run/secrets/REDIS_PASSWORD)" > /tmp/redis.conf && exec redis-server /tmp/redis.conf'
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/REDIS_PASSWORD)\" ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app_net

  api:
    <<: *default-security
    image: ${DOCKER_IMAGE_NAME_WEB:?missing DOCKER_IMAGE_NAME_WEB (set in deploy/.env.ec2 via make release-image-env)}
    container_name: api
    stop_grace_period: 40s
    logging: *default-logging
    env_file: *deploy-env-file
    secrets: *app-secrets
    environment:
      <<: [ *backend-aws-env, *secret-file-env ]
      PYTHONMALLOC: default
      WEB_CONCURRENCY: "1"
      FORWARDED_ALLOW_IPS: ${API_NGINX_PROXY_IP:-172.30.0.11}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 800M
        reservations:
          memory: 256M
    depends_on:
      redis:
        condition: service_healthy
      db_migrator:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/health_check/live\", timeout=5)' || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      app_net:
      edge_net:
        aliases:
          - dewflow-api

  api-nginx:
    <<: *default-security
    image: nginx:1.30.1-alpine
    container_name: api-nginx
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${API_NGINX_BIND:-127.0.0.1}:${API_NGINX_PORT:-8081}:8080"
    volumes:
      - ./nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      edge_net:
        ipv4_address: ${API_NGINX_PROXY_IP:-172.30.0.11}
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  frontend:
    <<: *default-security
    image: ${DOCKER_IMAGE_NAME_FRONTEND:?missing DOCKER_IMAGE_NAME_FRONTEND (set in deploy/.env.ec2 via make release-image-env)}
    container_name: frontend
    profiles: [ "frontend-fallback" ]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PUBLIC_PORT:-80}:8080"
    networks:
      edge_net:
        ipv4_address: ${FRONTEND_PROXY_IP:-172.30.0.10}
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  bifrost:
    <<: *default-security
    image: maximhq/bifrost:v1.4.11
    container_name: bifrost
    profiles: [ "bifrost" ]
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      BIFROST_LOG_LEVEL: ${BIFROST_LOG_LEVEL:-info}
      LOG_STYLE: json
    secrets:
      - BIFROST_API_KEY
      - BIFROST_ENCRYPTION_KEY
      - DEEPSEEK_API_KEY
      - DEEPSEEK_API_KEY_2
      - DASHSCOPE_API_KEY
      - DASHSCOPE_API_KEY_2
      - COHERE_API_KEY
      - COHERE_API_KEY_2
    volumes:
      - bifrost_data:/app/data
      - ../configs/bifrost/config.json:/app/data/config.json:ro
    entrypoint:
      - sh
      - -c
      - "export BIFROST_API_KEY=\"$$(cat /run/secrets/BIFROST_API_KEY | tr -d '\\015\\012')\" && export BIFROST_ENCRYPTION_KEY=\"$$(cat /run/secrets/BIFROST_ENCRYPTION_KEY | tr -d '\\015\\012')\" && export DEEPSEEK_API_KEY=\"$$(cat /run/secrets/DEEPSEEK_API_KEY | tr -d '\\015\\012')\" && export DEEPSEEK_API_KEY_2=\"$$(cat /run/secrets/DEEPSEEK_API_KEY_2 | tr -d '\\015\\012')\" && export DASHSCOPE_API_KEY=\"$$(cat /run/secrets/DASHSCOPE_API_KEY | tr -d '\\015\\012')\" && export DASHSCOPE_API_KEY_2=\"$$(cat /run/secrets/DASHSCOPE_API_KEY_2 | tr -d '\\015\\012')\" && export COHERE_API_KEY=\"$$(cat /run/secrets/COHERE_API_KEY | tr -d '\\015\\012')\" && export COHERE_API_KEY_2=\"$$(cat /run/secrets/COHERE_API_KEY_2 | tr -d '\\015\\012')\" && exec /app/main -app-dir /app/data -port \"$${APP_PORT}\" -host \"$${APP_HOST}\" -log-level \"$${BIFROST_LOG_LEVEL}\" -log-style \"$${LOG_STYLE}\""
    ports:
      - "${BIFROST_BIND:-127.0.0.1}:${BIFROST_PORT:-18080}:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- --header=\"x-bf-vk: $$(cat /run/secrets/BIFROST_API_KEY | tr -d '\\015\\012')\" http://127.0.0.1:8080/v1/models >/dev/null || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app_net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  db_migrator:
    <<: *default-security
    image: ${DOCKER_IMAGE_NAME_WEB:?missing DOCKER_IMAGE_NAME_WEB (set in deploy/.env.ec2 via make release-image-env)}
    logging: *default-logging
    command: alembic upgrade head
    env_file: *deploy-env-file
    secrets: *db-migration-secrets
    environment:
      <<: [ *backend-aws-env, *db-migration-secret-file-env ]
    networks:
      - app_net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  task_worker:
    <<: *default-security
    image: ${DOCKER_IMAGE_NAME_AI:?missing DOCKER_IMAGE_NAME_AI (set in deploy/.env.ec2 via make release-image-env)}
    container_name: task_worker
    stop_grace_period: 120s
    env_file: *deploy-env-file
    secrets: *app-secrets
    environment:
      <<: [ *backend-aws-env, *secret-file-env ]
      TASKIQ_HEALTH_MIN_PROCESSES: "2"
      # Single source of truth for prod task modules; the image CMD consumes it.
      TASKIQ_MODULES: "backend.worker.tasks.llm_tasks backend.worker.tasks.knowledge_tasks backend.worker.tasks.repo_analysis_tasks backend.worker.tasks.credit_tasks backend.worker.tasks.chat_recovery_tasks"
      TASKIQ_WORKERS: "2"
      TASKIQ_WAIT_TASKS_TIMEOUT: "105"
      TASKIQ_SHUTDOWN_TIMEOUT: "10"
    healthcheck:
      test: [ "CMD-SHELL", "python -m backend.worker.tasks.healthcheck || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      redis:
        condition: service_healthy
      db_migrator:
        condition: service_completed_successfully
    networks:
      - app_net
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 128M

  # Enqueues TaskIQ tasks carrying a `schedule` label. Reuses the worker image
  # so release and rollback only manage the existing DOCKER_IMAGE_NAME_AI tag.
  credit_scheduler:
    <<: *default-security
    image: ${DOCKER_IMAGE_NAME_AI:?missing DOCKER_IMAGE_NAME_AI (set in deploy/.env.ec2 via make release-image-env)}
    container_name: credit_scheduler
    # SIGINT: taskiq scheduler ignores SIGTERM; asyncio.run only cancels the main task on SIGINT, triggering graceful shutdown.
    stop_signal: SIGINT
    stop_grace_period: 30s
    command: sh -c 'exec taskiq scheduler backend.worker.scheduler_entrypoint:build_scheduler $${TASKIQ_SCHEDULER_MODULES:-backend.worker.tasks.credit_tasks backend.worker.tasks.knowledge_tasks backend.worker.tasks.chat_recovery_tasks}'
    env_file: *deploy-env-file
    secrets: *app-secrets
    environment:
      <<: [ *backend-aws-env, *secret-file-env ]
      TASKIQ_SCHEDULER_MODULES: "backend.worker.tasks.credit_tasks backend.worker.tasks.knowledge_tasks backend.worker.tasks.chat_recovery_tasks"
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'from backend.worker.scheduler_entrypoint import validate_scheduler_schedules; validate_scheduler_schedules()' || exit 1" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      redis:
        condition: service_healthy
      db_migrator:
        condition: service_completed_successfully
    networks:
      - app_net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

networks:
  app_net:
    driver: bridge
  edge_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${EDGE_NETWORK_SUBNET:-172.30.0.0/24}

volumes:
  bifrost_data:
    name: bifrost_data_volume

secrets:
  SECRET_KEY:
    file: ${DEPLOY_SECRET_KEY_FILE:-../secrets/ec2/secret_key.txt}
  POSTGRES_PASSWORD:
    file: ${DEPLOY_POSTGRES_PASSWORD_FILE:-../secrets/ec2/postgres_password.txt}
  REDIS_PASSWORD:
    file: ${DEPLOY_REDIS_PASSWORD_FILE:-../secrets/ec2/redis_password.txt}
  OPENAI_API_KEY:
    file: ${DEPLOY_OPENAI_API_KEY_FILE:-../secrets/ec2/openai_api_key.txt}
  DASHSCOPE_API_KEY:
    file: ${DEPLOY_DASHSCOPE_API_KEY_FILE:-../secrets/ec2/dashscope_api_key.txt}
  DASHSCOPE_API_KEY_2:
    file: ${DEPLOY_DASHSCOPE_API_KEY_2_FILE:-../secrets/ec2/dashscope_api_key_2.txt}
  GEMINI_API_KEY:
    file: ${DEPLOY_GEMINI_API_KEY_FILE:-../secrets/ec2/gemini_api_key.txt}
  GOOGLE_API_KEY:
    file: ${DEPLOY_GOOGLE_API_KEY_FILE:-../secrets/ec2/google_api_key.txt}
  GOOGLE_CLIENT_SECRET:
    file: ${DEPLOY_GOOGLE_CLIENT_SECRET_FILE:-../secrets/ec2/google_client_secret.txt}
  GITHUB_TOKEN:
    file: ${DEPLOY_GITHUB_TOKEN_FILE:-../secrets/ec2/github_token.txt}
  GROWTHBOOK_SDK_KEY:
    file: ${DEPLOY_GROWTHBOOK_SDK_KEY_FILE:-../secrets/ec2/growthbook_sdk_key.txt}
  DEEPSEEK_API_KEY:
    file: ${DEPLOY_DEEPSEEK_API_KEY_FILE:-../secrets/ec2/deepseek_api_key.txt}
  DEEPSEEK_API_KEY_2:
    file: ${DEPLOY_DEEPSEEK_API_KEY_2_FILE:-../secrets/ec2/deepseek_api_key_2.txt}
  COHERE_API_KEY:
    file: ${DEPLOY_COHERE_API_KEY_FILE:-../secrets/ec2/cohere_api_key.txt}
  COHERE_API_KEY_2:
    file: ${DEPLOY_COHERE_API_KEY_2_FILE:-../secrets/ec2/cohere_api_key_2.txt}
  BIFROST_API_KEY:
    file: ${DEPLOY_BIFROST_API_KEY_FILE:-../secrets/ec2/bifrost_api_key.txt}
  BIFROST_ENCRYPTION_KEY:
    file: ${DEPLOY_BIFROST_ENCRYPTION_KEY_FILE:-../secrets/ec2/bifrost_encryption_key.txt}
  LLM_API_KEY:
    file: ${DEPLOY_LLM_API_KEY_FILE:-../secrets/ec2/llm_api_key.txt}
  RAG_EMBED_API_KEY:
    file: ${DEPLOY_RAG_EMBED_API_KEY_FILE:-../secrets/ec2/rag_embed_api_key.txt}
  LANGFUSE_PUBLIC_KEY:
    file: ${DEPLOY_LANGFUSE_PUBLIC_KEY_FILE:-../secrets/ec2/langfuse_public_key.txt}
  LANGFUSE_SECRET_KEY:
    file: ${DEPLOY_LANGFUSE_SECRET_KEY_FILE:-../secrets/ec2/langfuse_secret_key.txt}
  S3_ACCESS_KEY_ID:
    file: ${DEPLOY_S3_ACCESS_KEY_ID_FILE:-../secrets/ec2/s3_access_key_id.txt}
  S3_SECRET_ACCESS_KEY:
    file: ${DEPLOY_S3_SECRET_ACCESS_KEY_FILE:-../secrets/ec2/s3_secret_access_key.txt}
  TAVILY_API_KEY:
    file: ${DEPLOY_TAVILY_API_KEY_FILE:-../secrets/ec2/tavily_api_key.txt}
