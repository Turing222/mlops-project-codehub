#通用的日志模板
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# AWS-like runtime defaults for backend containers.
# Keep S3_ENDPOINT_URL and static credentials empty so boto3 uses real AWS S3
# and the default credential chain, preferably an EC2 instance profile.
x-backend-aws-env: &backend-aws-env
  APP_ENV: ${APP_ENV:-prod}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_PREFIX: ${S3_PREFIX:-knowledge_files}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-disable}
services:

  postgres:
    image: pgvector/pgvector:0.8.1-pg17-bookworm
    container_name: postgres
    env_file:
      - ../.env
    # 1. 在服务内挂载卷
    volumes:
      - pg_data_v17:/var/lib/postgresql/data
      - ./scripts/pgsql_backup.sh:/usr/local/bin/pg_backup.sh:ro
      - pg_backups:/backup
    logging: *default-logging
    #entrypoint: [ "/bin/sh", "/usr/local/bin/pg_backup.sh" ]
    deploy:
      resources:
        limits:
          memory: 1024M
          #共享缓冲区 工作内存 维护工作内存 有效缓存预测 最大连接数
    command: >
      postgres -c shared_buffers=256MB   -c work_mem=32MB   -c maintenance_work_mem=128MB  -c effective_cache_size=768MB -c max_connections=200 -c logging_collector=off
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  redis:
    image: redis:7.4-alpine
    container_name: redis
    env_file:
      - ../.env # 确保路径正确，读取刚才定义的变量
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging
    # 通过 --requirepass 参数启用密码
    command: >
      redis-server  --maxmemory 384mb  --maxmemory-policy allkeys-lru  --requirepass "${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app_net
  api:
    image: dewflow-backend:2.0.0-web
    container_name: api
    stop_grace_period: 40s
    volumes:
      - knowledge_files_volume:/data/knowledge_files
    logging: *default-logging
    user: "${CURRENT_UID}:${CURRENT_GID}"
    env_file:
      - ../.env
    environment:
      <<: *backend-aws-env
      PYTHONMALLOC: default
      WEB_CONCURRENCY: "1"
      LOCAL_STORAGE_ROOT: /data/knowledge_files
    cap_add:
      - SYS_PTRACE
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 800M
        reservations:
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db_migrator:
        condition: service_completed_successfully
      vector:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/health_check/live\", timeout=5)' || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips "*" --timeout-graceful-shutdown 30
    networks:
      - app_net
      - monitor_net
  frontend:
    image: ${DOCKER_IMAGE_NAME_FRONTEND:-dewflow-frontend:2.0.0}
    container_name: frontend
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:8080"
    networks:
      - app_net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    # 移除 profile 使其默认启动，它是监控系统的核心
    logging: *default-logging
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
      # 限制数据只保留 7 天，防止硬盘撑爆
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-otlp-receiver'
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - monitor_net

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: postgres_exporter
    environment:
      # 连接字符串，指向同网络下的 postgres 服务
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net
      - monitor_net
    deploy:
      resources:
        limits:
          memory: 128M

  redis_exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: redis_exporter
    environment:
      # 指向同网络下的 redis 服务，并传入密码
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_started
    networks:
      - app_net
      - monitor_net
    deploy:
      resources:
        limits:
          memory: 128M

  grafana:
    image: grafana/grafana-oss:11.5.8-ubuntu
    container_name: grafana
    logging: *default-logging
    environment:
      - GF_ANALYTICS_REPORTING_ENABLED=false # 禁用统计上报
      - GF_AUTH_ANONYMOUS_ENABLED=false # 生产环境必须关闭匿名访问
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    volumes:
      - ./monitoring/grafana_datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./monitoring/grafana_dashboards_provisioning.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards/dewflow:ro
    networks:
      - monitor_net

  # 2. 日志中转 (Vector)
  vector:
    image: timberio/vector:0.50.0-debian
    # 移除 profile 使其默认启动
    container_name: vector
    volumes:
      - ./logging/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - monitor_net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # 3. 日志存储 (Loki)
  loki:
    image: grafana/loki:3.4.0
    container_name: loki
    # 移除 profile 使其默认启动
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - monitor_net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
  # 1. 专门负责“更新数据库”的工具人

  db_migrator:
    image: dewflow-backend:2.0.0-web
    depends_on:
      postgres:
        condition: service_healthy
    # 覆盖默认启动命令，只跑迁移
    command: alembic upgrade head
    env_file:
      - ../.env
    environment:
      <<: *backend-aws-env
    networks:
      - app_net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # 4. 压力测试 (Locust)
  locust:
    image: locustio/locust:2.33.0
    container_name: locust
    volumes:
      - ../tests:/mnt/locust # 挂载测试脚本目录
    command: -f /mnt/locust/performance/locustfile.py --host http://api:8000
    profiles: [ "debug" ] # 设置为 debug 模式启动，默认不开启
    ports:
      - "8089:8089"
    networks:
      - app_net
      - monitor_net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # 5. 异步长连接任务队列 Taskiq Worker
  task_worker:
    image: dewflow-backend:2.0.0-ai
    container_name: task_worker
    stop_grace_period: 120s
    volumes:
      - knowledge_files_volume:/data/knowledge_files
    env_file:
      - ../.env
    environment:
      <<: *backend-aws-env
      TASKIQ_REDIS_URL: ${TASKIQ_REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/1}
      LOCAL_STORAGE_ROOT: /data/knowledge_files
    command: taskiq worker backend.infra.task_broker:broker backend.worker.tasks.llm_tasks backend.worker.tasks.knowledge_tasks --workers 2 --wait-tasks-timeout 105 --shutdown-timeout 10
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app_net
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 128M

networks:
  app_net:
    driver: bridge
  monitor_net:
    driver: bridge

volumes:
  pg_data_v17:
    name: prod_db_volume
  loki_data:
    name: loki_data_volume
  pg_backups:
    name: pg_backups_volume
  knowledge_files_volume:
    name: knowledge_files_volume
