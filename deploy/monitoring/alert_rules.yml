groups:
  - name: dewflow_core_alerts
    rules:
      # 1. 服务存活告警 (最基础的：某个容器挂了)
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: '服务节点离线: {{ $labels.job }}'
          description: 'Job {{ $labels.job }} 对应的实例 {{ $labels.instance }} 已失联超过 1 分钟。'

      # 2. API 高延迟告警 (P99 > 5秒)
      # 理由：默认 HTTP duration 直方图最大有限桶为 10s；histogram_quantile 落入 +Inf 桶时
      # 恰好返回 10.0，因此阈值必须严格小于 10 才可能触发。
      - alert: ApiHighLatency
        expr: histogram_quantile(0.99, sum(rate(http_server_request_duration_seconds_bucket{service_name="fastapi-backend"}[5m])) by (le, http_route)) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'API 响应过慢: {{ $labels.http_route }}'
          description: 'API 接口 {{ $labels.http_route }} 的 P99 响应延迟已达到 {{ $value | printf "%.2f" }}s。'

      # 3. 后端 5xx 错误率预警 (> 5%)
      - alert: ApiErrorRateHigh
        expr: (sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5..",service_name="fastapi-backend"}[5m])) by (http_route) / sum(rate(http_server_request_duration_seconds_count{service_name="fastapi-backend"}[5m])) by (http_route)) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'API 错误率飙升: {{ $labels.http_route }}'
          description: '接口 {{ $labels.http_route }} 的 5xx 错误率已超过 5% (当前: {{ $value | humanizePercentage }})。'

      # 4. Redis 内存预警 (> 85%)
      # 理由：Redis 爆满会导致聊天会话无法存取，导致系统瘫痪
      - alert: RedisMemoryUsageHigh
        expr: redis_memory_used_bytes / 402653184 > 0.85 # 基于你 command 里的 384MB 限制
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Redis 内存不足'
          description: 'Redis 已使用内存超过 85% (当前: {{ $value | humanizePercentage }})。'

      # 5. Postgres 连接数枯竭 (> 80%)
      - alert: PostgresConnectionsExhausted
        expr: sum(pg_stat_activity_count) / 200 > 0.8 # 基于你 command 里的 max_connections=200
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: 'Postgres 连接数告急'
          description: '数据库连接数即将耗尽 (当前占比: {{ $value | humanizePercentage }})。'
