global:
  scrape_interval: 15s # 每 15 秒抓取一次数据，默认是 1 分钟

rule_files:
  - "alert_rules.yml" # 仅加载规则；当前 profile 未接 Alertmanager / delivery path

scrape_configs:
  # Prometheus 监控它自己
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI 后端：实际指标通过 OTLP push 到 Prometheus receiver；此处仅用于 `up` 存活探测。
  # 当前未抓取 worker，也不要把这里当成 Prometheus-native `/metrics` 指标源。
  - job_name: "fastapi-backend"
    static_configs:
      - targets: ["api:8000"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis_exporter:9121"]