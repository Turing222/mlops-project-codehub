log_format json_combined escape=json
  '{'
    '"timestamp":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request":"$request",'
    '"message":"$request_method $request_uri $server_protocol -> $status",'
    '"status":"$status",'
    '"body_bytes_sent":"$body_bytes_sent",'
    '"request_time":"$request_time",'
    '"http_referrer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"rid":"$dewflow_request_id"'
  '}';

map $http_x_request_id $dewflow_request_id {
    default $http_x_request_id;
    "" $request_id;
}

map $http_cf_connecting_ip $dewflow_real_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}

map $http_x_forwarded_proto $dewflow_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

upstream dewflow_api {
    least_conn;
    server api:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    access_log /dev/stdout json_combined;
    error_log /dev/stderr warn;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://dewflow_api;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $dewflow_request_id;
        proxy_set_header X-Real-IP $dewflow_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dewflow_forwarded_proto;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_ignore_client_abort on;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "OK";
    }
}
