log_format json_combined escape=json
  '{'
    '"timestamp":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request":"$request",'
    '"message":"$request_method $request_uri $server_protocol -> $status",'
    '"status":"$status",'
    '"body_bytes_sent":"$body_bytes_sent",'
    '"request_time":"$request_time",'
    '"http_referrer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"rid":"$dewflow_request_id"'
  '}';

map $http_x_request_id $dewflow_request_id {
    default $http_x_request_id;
    "" $request_id;
}

map $http_cf_connecting_ip $dewflow_real_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}

map $http_x_forwarded_proto $dewflow_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # compose 内嵌 DNS;变量 proxy_pass + resolver 使 api 容器重建换 IP 后无需重启 nginx
    resolver 127.0.0.11 valid=10s ipv6=off;

    access_log /dev/stdout json_combined;
    error_log /dev/stderr warn;

    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;

    location /api/ {
        set $dewflow_api_upstream http://api:8000;
        proxy_pass $dewflow_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $dewflow_request_id;
        proxy_set_header X-Real-IP $dewflow_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dewflow_forwarded_proto;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }
}
