apiVersion: v1
kind: ConfigMap
metadata:
  name: dewflow-config
  namespace: dewflow
data:
  APP_ENV: "prod"
  # App metadata (PROJECT_NAME / VERSION / API_ROOT_PATH / API_V1_STR) is owned
  # by configs/app/base.yaml, baked into the image. Do not duplicate it here:
  # configMap envs override the image (env > YAML) and would silently drift.
  POSTGRES_DB: "dewflow"
  POSTGRES_SERVER: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_POOL_SIZE: "10"
  POSTGRES_MAX_OVERFLOW: "20"
  POSTGRES_CONNECT_TIMEOUT_SECONDS: "10"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  LLM_PROVIDER: "deepseek"
  RAG_EMBED_PROVIDER: "dashscope"
  RAG_MIN_HIT_COUNT: "1"
  RAG_MIN_RELEVANCE_SCORE: "0.2"
  RAG_MIN_RERANK_SCORE: "4.0"
  RAG_RERANK_PROVIDER: "bifrost"
  RAG_RERANK_MODEL: "qwen3-rerank"
  RAG_REFUSAL_MESSAGE: "知识库中没有找到足够相关的信息，暂时无法基于资料回答。"
  STORAGE_BACKEND: "local"
  LOCAL_STORAGE_ROOT: "/data/knowledge_files"
  S3_BUCKET: "knowledge-files"
  S3_PREFIX: "knowledge_files"
  S3_REGION: "us-east-1"
  S3_ENDPOINT_URL: "http://minio:9000"
  ENABLE_OTEL_METRICS: "false"
  ENABLE_OTEL_TRACES: "false"
  # Set OTEL_TRACES_ENDPOINT only after adding a trace backend/collector.
  OTEL_METRICS_ENDPOINT: "http://prometheus:9090/api/v1/otlp"
  LANGFUSE_BASE_URL: "https://us.cloud.langfuse.com"
