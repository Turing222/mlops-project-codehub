slug: security-operability-baseline
title: Security and Operability Baseline
status: paused

goal: Establish the P0/P1 production security and operability baseline for Dewflow without taking on P2 performance or architecture work.

completion_chain:
  - Production security guardrails are enforced for secrets, mock auth settings, and public API documentation.
  - Authentication entrypoints have rate limiting and SMS verification abuse protection designed for real client IPs.
  - Supply-chain scanning runs in CI for Python dependencies, container images, and dependency update hygiene.
  - CSP rollout and alert delivery are configured with a safe validation path.
  - Focused tests, CI checks, and deployment notes prove each workstream is ready to ship.

