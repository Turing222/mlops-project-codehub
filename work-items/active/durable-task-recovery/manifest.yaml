  state: validated
  summary: >-
    WS6 is complete: a guarded disposable runner migrated a fresh PostgreSQL
    database and validated six real-process fault contracts across the isolated
    cache and TaskIQ Redis instances. Full Redis restart, DB commit/enqueue gaps,
    Chat and Knowledge Worker SIGKILL, duplicate terminal/delivery, late-attempt
    fencing, bounded dispatch exhaustion, single Credits settlement, single
    chunk write, and result TTL all passed. WS7 remains to freeze the T1-5
    observability handoff and close T1-4.

