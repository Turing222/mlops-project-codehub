    title: Freeze T1-4 recovery contracts and characterize the current crash windows.
    status: done
    kind: blocking
    deps: []
  - id: 2
    title: Add failing boundary tests for Chat, Knowledge, and Redis recovery.
    status: done
    kind: serial
    deps: [1]
  - id: 3
    title: Implement Chat CAS recovery and the generation-request reconciler.
    status: done
    kind: serial
    deps: [2]
  - id: 4
    title: Implement Knowledge durable ingestion, outbox relay, and conditional claim.
    status: done
    kind: serial
    deps: [3]
  - id: 5
    title: Isolate cache Redis from the persistent task broker and result backend.
    status: done
    kind: serial
    deps: [4]
  - id: 6
    title: Validate restart, duplicate-delivery, and worker-termination convergence.
    status: done
    kind: serial
    deps: [3, 4, 5]
  - id: 7
