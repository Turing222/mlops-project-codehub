    title: Freeze T1-4 recovery contracts and characterize the current crash windows.
    status: done
    kind: blocking
    deps: []
  - id: 2
    title: Add failing boundary tests for Chat, Knowledge, and Redis recovery.
    status: done
    kind: serial
    deps: [1]
  - id: 3
    title: Implement Chat CAS recovery and the generation-request reconciler.
    status: done
    kind: serial
    deps: [2]
  - id: 4
    title: Implement Knowledge durable ingestion, outbox relay, and conditional claim.
    status: done
    kind: serial
    deps: [3]
  - id: 5
    title: Isolate cache Redis from the persistent task broker and result backend.
    status: done
    kind: serial
    deps: [4]
  - id: 6
    title: Validate restart, duplicate-delivery, and worker-termination convergence.
    status: pending
    kind: serial
    deps: [3, 4, 5]
  - id: 7
    title: Record the T1-5 observability handoff and close T1-4.
    status: pending
    kind: serial
    deps: [6]

current_checkpoint:
  name: t1-4-redis-responsibility-isolated
  state: validated
  summary: >-
    WS5 is complete: cache traffic uses an evictable redis-cache instance while
    TaskIQ broker/result traffic uses a distinct redis-taskiq instance with
    noeviction, AOF everysec, a persistent volume, healthchecks, and a one-hour
    result TTL. Settings, Compose, CI, smoke helpers, and Kubernetes references
    share the dedicated endpoint contract. Real cache and TaskIQ clients pass,
    and TaskIQ data survived container removal and recreation. The full domain
    restart, duplicate-delivery, and worker-termination matrix remains WS6.

