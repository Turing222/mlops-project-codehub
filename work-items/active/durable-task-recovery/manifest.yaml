    label: Start Redis isolation
    note: Implement WS5 cache/task broker separation now that both durable domain checkpoints are validated.
  - id: B
    label: Pause after Knowledge recovery
    note: Preserve the independently validated WS3 and WS4 commits if another first-tier incident must preempt Redis isolation.

