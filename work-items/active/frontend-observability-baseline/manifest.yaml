slug: frontend-observability-baseline
title: Frontend Observability and Measurement Baseline
status: active

goal: Fill the frontend observability gaps, correct the migration baseline, and establish bundle and Web Vitals measurement without taking on product rich-text, token storage, Sentry, or stream retry work.

completion_chain:
  - Client-side render errors, global JavaScript errors, unhandled promise rejections, and chat stream failures are visible through the telemetry path with clear event semantics.
  - "`frontend/docs/migration-plan.md` reflects the current frontend architecture and no longer lists completed work as pending."
  - Bundle size analysis and Web Vitals metrics provide a baseline for future performance decisions without performing speculative optimization.
  - Focused tests or validation prove the new observability and measurement paths, and deferred items remain explicitly out of scope.

workstreams:
  - id: 1
    title: Telemetry event semantics.
    status: done
    kind: blocking
    deps: []
  - id: 2
    title: Client error and chat stream observability.
    status: done
    kind: parallel
    deps: [1]
  - id: 3
    title: Migration plan synchronization.
    status: done
    kind: parallel
    deps: []
  - id: 4
    title: Performance and bundle baseline.
    status: pending
    kind: parallel
    deps: [1]
  - id: 5
    title: Focused validation and handoff.
    status: pending
    kind: serial
    deps: [2, 3, 4]

current_checkpoint:
  name: telemetry-and-client-observability-shipped
  state: in_progress
  summary: Telemetry event semantics (WS1) and client/stream error observability (WS2) are implemented, tested (backend component + full frontend vitest), and review-hardened; performance and Web Vitals baseline (WS4) is the next gap.

open_decisions: []

next_choices:
  - id: A
    label: Add measurement baseline
    note: Add bundle visualizer output and Web Vitals (LCP/INP/CLS) metrics through a dedicated metrics channel, keeping them out of the error telemetry log (WS4).
  - id: B
    label: Validation and handoff
    note: Run focused telemetry and build checks, then record the WS5 checkpoint once measurement lands.

attached_artifacts:
