    label: Define telemetry semantics
    note: Decide endpoint and payload shape for API errors, client errors, chat stream failures, and Web Vitals before adding new reporters.
  - id: B
    label: Add measurement
    note: Add bundle visualizer and Web Vitals metrics after telemetry event semantics are stable.

