    title: Validate rollout behavior and hand off T1-4 recovery dependencies.
    status: pending
    kind: serial
    deps: [5]

current_checkpoint:
  name: ws5-authorized-explicit-retry-implemented
  state: implemented
  summary: Actor-scoped request status resolution, expected-attempt retry dispatch, additive SSE and session-detail identity, and the backend-controlled chat-explicit-retry frontend path are implemented. The old local-ID replay and new-ID fallback paths are removed; missing flag, identity, or durable status fails closed. Full unit, component, frontend, mock E2E, production build, and disposable PostgreSQL checks pass. The WS5 checkpoint is complete; WS6 owns rollout fault-matrix validation and the T1-4/T1-5 handoff.

open_decisions:
  - id: quality-baseline-disposition
    note: Clear the pre-existing Ruff format debt and scripts/qa/check_serena_mcp.py bare loop in a separate T1-1 cleanup before PR 1 is merged; focused T1-3 regression work may proceed meanwhile.
  - id: chat-explicit-retry-rollout
    note: The solo maintainer owns rollout. Keep chat-explicit-retry default-off through WS5, enable it only after the WS6 flag-on/off and refreshed-session fault matrix passes, retain it for one observation window as the rollback switch, then remove the frontend branch and backend registration together.

