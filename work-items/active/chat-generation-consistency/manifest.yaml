current_checkpoint:
  name: ws4-atomic-runtime-path-validated
  state: validated
  summary: Web now commits PREPARED before fenced queue dispatch, Worker claims the authorized request, actor, session, message, task, attempt, and lease before generation, and terminal message state, Credits settlement, and request outcome share one PostgreSQL transaction. Stale attempts roll back, Redis terminal observation failures cannot reverse committed state, and focused unit, full unit, component, TaskIQ compatibility, and disposable PostgreSQL integration suites pass. Retry APIs and frontend behavior remain scoped to WS5; automatic recovery remains a T1-4 dependency.

