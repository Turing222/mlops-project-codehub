slug: t1-lite-alerting-content-safety
title: T1-Lite Alerting and Content Safety
status: active

goal: Deliver a controlled-internal T1-Lite baseline through minimum actionable alerting and content-safe telemetry defaults without new SMS production work or production recovery evidence.

completion_chain:
  - The approved T1-Lite boundary is recorded in the roadmap and owns the transferred minimum-alerting scope.
  - Critical alert-producing paths emit stable top-level event, error, task, attempt, and duration fields without raw user content.
  - API failures and latency, queue backlog, end-to-end worker and scheduler liveness, terminal task failures, and Redis eviction or restart have bounded signals and alarms.
  - At least one non-recovery controlled signal reaches a CloudWatch Alarm and a confirmed SNS receiver.
  - Default telemetry omits query, history, output, reasoning, and unsafe raw content, while ordinary message metadata stores only safe summaries.
  - Focused tests prove reasoning and unsafe raw content do not reach SSE, ordinary persistence, or telemetry, and the result is described only as controlled-internal T1-Lite.

