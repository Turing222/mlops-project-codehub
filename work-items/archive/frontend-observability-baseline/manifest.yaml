slug: frontend-observability-baseline
title: Frontend Observability and Measurement Baseline
status: done

goal: Fill the frontend observability gaps, correct the migration baseline, and establish bundle and Web Vitals measurement without taking on product rich-text, token storage, Sentry, or stream retry work.

completion_chain:
  - Client-side render errors, global JavaScript errors, unhandled promise rejections, and chat stream failures are visible through the telemetry path with clear event semantics.
  - "`frontend/docs/migration-plan.md` reflects the current frontend architecture and no longer lists completed work as pending."
  - Bundle size analysis and Web Vitals metrics provide a baseline for future performance decisions without performing speculative optimization.
  - Focused tests or validation prove the new observability and measurement paths, and deferred items remain explicitly out of scope.

