name: Smoke CI

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - "Dockerfile"
      - "docker-compose*.yml"
      - "Makefile"
      - ".env.features.template"
      - ".env.smoke.template"
      - "scripts/smoke/**"
      - "scripts/image/**"
      - "scripts/lib/common.sh"
      - "tests/smoke/**"
      - ".github/workflows/smoke-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Cache Python virtualenv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: uv-${{ runner.os }}-py312-${{ hashFiles('uv.lock') }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-py312-

      - name: Sync Python dependencies
        run: uv sync --frozen --dev --all-extras

      - name: Prepare smoke environment file
        run: make env-smoke-prepare

      - name: Use mock AI providers for CI smoke
        run: make set-llm PROVIDER=mock EMBED_PROVIDER=mock

      - name: Build Docker image
        run: make image-build

      - name: Start smoke environment
        run: make env-smoke-up

      - name: Wait for smoke environment
        run: make env-smoke-wait

      - name: Verify smoke checks
        env:
          SMOKE_STRICT: "true"
        run: make verify-smoke

      - name: Dump smoke logs on failure
        if: failure()
        run: make env-smoke-logs

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-logs
          path: |
            logs/smoke/*.log
            logs/smoke/*.txt
          if-no-files-found: ignore

      - name: Tear down smoke environment
        if: always()
        run: make env-smoke-down
