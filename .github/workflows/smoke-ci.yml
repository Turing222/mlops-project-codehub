name: Smoke CI

on:
  push:
    branches: [main, master]
  # Docker smoke 是 main 的 required check：不能带路径过滤，否则
  # 纯文档/配置 PR 会因该 check 永不上报而卡死在 BLOCKED。
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Cache Python virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: uv-${{ runner.os }}-py312-${{ hashFiles('uv.lock') }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-py312-

      - name: Sync Python dependencies
        run: uv sync --frozen --dev --all-extras

      - name: Prepare smoke environment file
        run: make env-smoke-prepare

      - name: Use mock AI providers for CI smoke
        run: make set-llm PROVIDER=mock EMBED_PROVIDER=mock

      - name: Build Docker image
        run: make image-build

      - name: Start smoke environment
        run: make env-smoke-up

      - name: Wait for smoke environment
        run: make env-smoke-wait

      - name: Verify smoke checks
        env:
          SMOKE_STRICT: "true"
        run: make verify-smoke

      - name: Dump smoke logs on failure
        if: failure()
        run: make env-smoke-logs

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-logs
          path: |
            logs/smoke/*.log
            logs/smoke/*.txt
          if-no-files-found: ignore

      - name: Tear down smoke environment
        if: always()
        run: make env-smoke-down
