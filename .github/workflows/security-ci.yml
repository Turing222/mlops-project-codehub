name: Security CI

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/dependabot.yml"
      - ".github/workflows/security-ci.yml"
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-dependencies:
    name: Python dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install scan tools
        run: python -m pip install --upgrade pip uv pip-audit

      - name: Export locked Python dependencies
        run: |
          mkdir -p .tmp/security
          uv export \
            --frozen \
            --all-extras \
            --all-groups \
            --no-emit-project \
            --no-emit-workspace \
            --no-hashes \
            --format requirements.txt \
            --output-file .tmp/security/requirements.txt \
            > /dev/null

      - name: Run pip-audit
        run: >
          python -m pip_audit
          --requirement .tmp/security/requirements.txt
          --strict
          --progress-spinner off
          --desc
          --aliases

  backend-images:
    name: Backend image scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build backend web image
        run: docker build --target web -t dewflow-backend:security-web .

      - name: Scan backend web image
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: dewflow-backend:security-web
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Build backend worker image
        run: docker build --target worker -t dewflow-backend:security-worker .

      - name: Scan backend worker image
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: dewflow-backend:security-worker
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          format: table
          exit-code: "1"
