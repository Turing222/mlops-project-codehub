name: Security CI

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "frontend/pnpm-lock.yaml"
      - "frontend/package.json"
      - "frontend/apps/admin/package.json"
      - "frontend/apps/admin/Dockerfile"
      - ".github/dependabot.yml"
      - ".github/workflows/security-ci.yml"
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-dependencies:
    name: Python dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install scan tools
        run: python -m pip install --upgrade pip uv pip-audit

      - name: Export locked Python dependencies
        run: |
          mkdir -p .tmp/security
          uv export \
            --frozen \
            --all-extras \
            --no-default-groups \
            --no-emit-project \
            --no-emit-workspace \
            --no-hashes \
            --format requirements.txt \
            --output-file .tmp/security/requirements.txt \
            > /dev/null

      - name: Run pip-audit
        run: >
          python -m pip_audit
          --requirement .tmp/security/requirements.txt
          --strict
          --progress-spinner off
          --desc
          --aliases

      - name: Export dev Python dependencies
        run: |
          uv export \
            --frozen \
            --only-group dev \
            --no-emit-project \
            --no-emit-workspace \
            --no-hashes \
            --format requirements.txt \
            --output-file .tmp/security/requirements-dev.txt \
            > /dev/null

      - name: Audit dev Python dependencies
        continue-on-error: true
        run: >
          python -m pip_audit
          --requirement .tmp/security/requirements-dev.txt
          --strict
          --progress-spinner off
          --desc
          --aliases

  backend-images:
    name: Backend image scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Build backend web image
        run: docker build --target web -t dewflow-backend:security-web .

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan backend web image
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: dewflow-backend:security-web
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          format: table
          exit-code: "1"
          skip-setup-trivy: true

      - name: Build backend worker image
        run: docker build --target worker -t dewflow-backend:security-worker .

      - name: Scan backend worker image
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: dewflow-backend:security-worker
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          format: table
          exit-code: "1"
          skip-setup-trivy: true

  frontend-dependencies:
    name: Frontend dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.nvmrc

      # pnpm audit works from the lockfile alone; no install step needed.
      # The registry is pinned because mirror registries often lack the audit endpoint.
      - name: Audit production dependencies
        run: pnpm --dir frontend audit --prod --audit-level high --registry https://registry.npmjs.org

      - name: Audit dev dependencies
        run: pnpm --dir frontend audit --dev --audit-level critical --registry https://registry.npmjs.org

  # Also exercises the frontend fallback image build (Pages rollback path),
  # which no other workflow builds.
  frontend-image:
    name: Frontend image scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Build frontend fallback image
        run: docker build -f frontend/apps/admin/Dockerfile -t dewflow-frontend:security .

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan frontend fallback image
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: dewflow-frontend:security
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          format: table
          exit-code: "1"
          skip-setup-trivy: true
