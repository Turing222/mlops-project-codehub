name: Deploy Validate CI

on:
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/deploy-validate-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate deploy assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DOCKER_IMAGE_NAME_WEB: ci-validate-web:0
      DOCKER_IMAGE_NAME_AI: ci-validate-ai:0
      DOCKER_IMAGE_NAME_FRONTEND: ci-validate-frontend:0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare deploy env file from template
        run: cp deploy/.env.ec2.template deploy/.env.ec2

      - name: Validate production compose (all profiles)
        run: docker compose -f deploy/docker-compose.yml --profile bifrost --profile observability --profile debug --profile frontend-fallback config -q

      - name: Validate local-s3 rehearsal overlay
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local-s3.yml config -q

      - name: Validate api-nginx config
        run: docker run --rm -v "$PWD/deploy/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t

      - name: Validate k8s manifests
        run: |
          kubectl kustomize deploy/k8s > /dev/null
          kubectl kustomize deploy/k8s/local-scaling > /dev/null
