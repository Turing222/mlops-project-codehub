name: Static CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-static:
    name: Backend static
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Cache Python virtualenv
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .venv
          key: uv-${{ runner.os }}-py312-${{ hashFiles('uv.lock') }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-py312-

      - name: Sync Python dependencies
        run: uv sync --frozen --dev --all-extras

      - name: Lint
        run: make qa-lint

      - name: Format check
        run: make qa-format-check

      - name: Typecheck
        run: make qa-typecheck

      - name: Boundaries
        run: make qa-boundaries

      - name: Test markers
        run: make qa-test-markers

      - name: Alembic check
        run: make qa-alembic-check

      - name: Fast standards audit
        run: make qa-standards-fast

      - name: Unit tests
        run: make qa-test-unit

      - name: Component tests
        run: make qa-test-component

  frontend-static:
    name: Frontend static
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.nvmrc
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Lint
        run: make frontend-lint

      - name: Typecheck
        run: make frontend-typecheck

      - name: Unit tests
        run: make frontend-test

      # Coverage is report-only for now: v8 instrumentation surfaces a pre-existing
      # late react-dom scheduler teardown error (plain `make frontend-test` is clean).
      # Thresholds (floors) are configured in vitest.config.ts; drop continue-on-error
      # to enforce them once that teardown race is resolved. See assessment doc §9.
      - name: Coverage (report-only)
        continue-on-error: true
        run: make frontend-test-coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: frontend/apps/admin/coverage/**
          if-no-files-found: ignore

      - name: Build
        run: make frontend-build

      # Mock e2e runs in PR Gate CI only; merges are gated by branch protection.
      - name: Bundle size check
        run: make frontend-bundle-check

      # Exercises the Cloudflare Pages production build form (CF_PAGES=1 +
      # VITE_API_BASE_URL) and asserts dist/_headers carries a real CSP report-only.
      # Runs last because it overwrites dist/ with the prod-form output.
      - name: Pages production build check
        run: make frontend-build-pages-check
