name: Static CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-static:
    name: Backend static
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Cache Python virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: uv-${{ runner.os }}-py312-${{ hashFiles('uv.lock') }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-py312-

      - name: Sync Python dependencies
        run: uv sync --frozen --dev --all-extras

      - name: Lint
        run: make qa-lint

      - name: Format check
        run: make qa-format-check

      - name: Typecheck
        run: make qa-typecheck

      - name: Boundaries
        run: make qa-boundaries

      - name: Test markers
        run: make qa-test-markers

      - name: Alembic check
        run: make qa-alembic-check

      - name: Fast standards audit
        run: make qa-standards-fast

      - name: Unit tests
        run: make qa-test-unit

      - name: Component tests
        run: make qa-test-component

  frontend-static:
    name: Frontend static
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.nvmrc
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Lint
        run: make frontend-lint

      - name: Typecheck
        run: make frontend-typecheck

      # Unit tests run under coverage so the floors in vitest.config.ts are enforced
      # as a blocking gate; a plain `vitest run` would be a redundant second full pass.
      - name: Unit tests + coverage
        run: make frontend-test-coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/apps/admin/coverage/**
          if-no-files-found: ignore

      - name: Build
        run: make frontend-build

      # Mock e2e runs in PR Gate CI only; merges are gated by branch protection.
      - name: Bundle size check
        run: make frontend-bundle-check

      # Exercises the Cloudflare Pages production build form (CF_PAGES=1 +
      # VITE_API_BASE_URL) and asserts dist/_headers carries a real CSP report-only.
      # Runs last because it overwrites dist/ with the prod-form output.
      - name: Pages production build check
        run: make frontend-build-pages-check
