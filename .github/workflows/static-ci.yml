name: Static CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-static:
    name: Backend static
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Cache Python virtualenv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: uv-${{ runner.os }}-py312-${{ hashFiles('uv.lock') }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-py312-

      - name: Sync Python dependencies
        run: uv sync --frozen --dev --all-extras

      - name: Lint
        run: make qa-lint

      - name: Format check
        run: make qa-format-check

      - name: Typecheck
        run: make qa-typecheck

      - name: Boundaries
        run: make qa-boundaries

      - name: Test markers
        run: make qa-test-markers

      - name: Alembic check
        run: make qa-alembic-check

      - name: Fast standards audit
        run: make qa-standards-fast

      - name: Unit tests
        run: make qa-test-unit

      - name: Component tests
        run: make qa-test-component

  frontend-static:
    name: Frontend static
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: frontend/.nvmrc
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Lint
        run: make frontend-lint

      - name: Typecheck
        run: make frontend-typecheck

      - name: Unit tests
        run: make frontend-test

      - name: Build
        run: make frontend-build

      # Mock e2e runs in PR Gate CI only; merges are gated by branch protection.
      - name: Bundle size check
        run: make frontend-bundle-check
