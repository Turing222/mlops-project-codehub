name: Guard Branch Protection

# Cloudflare Pages 在 push 到 production branch 时立即部署，且不看 GitHub CI 结果。
# 因此部署 gate 只能落在合并时的 branch protection required checks 上。该配置在仓库外、
# 无法 review —— 本 workflow 定期回读 main 的 required checks，缺失即 fail，把“闸还在不在”
# 变成可观测信号。Required checks 单一来源：scripts/ci/required_status_checks.txt；
# 矩阵说明见 docs/workflows/ci-test-matrix.md §5。

on:
  schedule:
    - cron: "0 8 * * 1" # 周一 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-required-checks:
    name: Verify main required checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Assert required status checks on main
        env:
          # 默认 GITHUB_TOKEN 无权读取 branch protection；需一个仅授 Administration:Read
          # 的 fine-grained PAT，存为 secret BRANCH_PROTECTION_READ_TOKEN。
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_READ_TOKEN }}
          REPO: ${{ github.repository }}
          REQUIRED_CHECKS_FILE: scripts/ci/required_status_checks.txt
        run: |
          set -euo pipefail

          if [[ ! -f "$REQUIRED_CHECKS_FILE" ]]; then
            echo "::error::Missing required checks file: $REQUIRED_CHECKS_FILE"
            exit 1
          fi

          expected="$(grep -v '^[[:space:]]*#' "$REQUIRED_CHECKS_FILE" | grep -v '^[[:space:]]*$' || true)"
          if [[ -z "$expected" ]]; then
            echo "::error::$REQUIRED_CHECKS_FILE is empty"
            exit 1
          fi

          # 读取 classic branch protection 的 required status checks（合并 checks 与 legacy contexts）。
          actual="$(gh api "repos/$REPO/branches/main/protection/required_status_checks" \
            --jq '([.checks[]?.context] + (.contexts // [])) | unique | .[]' 2>/dev/null || true)"

          if [[ -z "$actual" ]]; then
            echo "::error::main 上没有 required status checks（branch protection 缺失，或 token 无 Administration:Read）。"
            echo "::error::任何直推 main 的代码会在 CI 出结果前就发布到生产 Pages。"
            exit 1
          fi

          echo "当前已配置的 required checks："
          echo "$actual" | sed 's/^/  - /'

          missing=0
          while IFS= read -r ctx; do
            ctx="$(echo "$ctx" | sed 's/^[[:space:]]*//')"
            [ -z "$ctx" ] && continue
            if ! grep -Fxq "$ctx" <<<"$actual"; then
              echo "::error::缺少必需的 required check：$ctx"
              missing=1
            fi
          done <<<"$expected"

          exit "$missing"

# rulesets 变体：若用 rulesets 而非 classic protection，把上面的 gh api 调用替换为
#   gh api "repos/$REPO/rulesets" --jq '.[] | select(.target=="branch") | .name'
# 再按需读取单个 ruleset 的 required_status_checks 规则。
